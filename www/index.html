*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}

.dot{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
main{flex:1;padding:6px 0 120px;display:grid;gap:12px;align-content:start}
main.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}

nav div{pointer-events:auto;max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:5px;background:color-mix(in srgb,var(--surf) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}

.sub{font-size:max(10px,calc(12px*var(--fs)));color:var(--dim)}
.sm{font-size:max(10px,calc(12px*var(--fs)));color:var(--dim)}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;min-width:0;font-size:max(10px,calc(13px*var(--fs)))}
.row>span:first-child{color:var(--dim)}

.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .acc{color:var(--acc)}

.btn:hover{border-color:var(--dim)} .btn:active{transform:scale(.97)}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-fg);font-weight:600}

.btns{display:flex;gap:8px;flex-wrap:wrap}

.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip:disabled{opacity:.4}
.lab{font-size:max(10px,calc(12px*var(--fs)));color:var(--dim);display:flex;justify-content:space-between;gap:10px}

label.f{display:grid;gap:6px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--surf2)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--surf2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:var(--acc);border:3px solid var(--surf);box-shadow:0 0 0 1px var(--acc),var(--shadow);margin-top:-8px}

.bar{height:6px;border-radius:3px;background:var(--surf2);overflow:hidden}

canvas{width:100%;display:block;border-radius:12px;background:var(--surf2)}

.wf b{font:500 max(10px,calc(12px*var(--fs))) var(--f-mono);text-align:right}
.log{display:grid;gap:8px;font-size:max(10px,calc(13px*var(--fs)))}
.log div{display:grid;grid-template-columns:54px 1fr;gap:10px}
.log time{color:var(--dim);font:max(10px,calc(11.5px*var(--fs))) var(--f-mono);padding-top:1px}
.log .good span{color:var(--good)} .log .bad span{color:var(--bad)}
.err{color:var(--bad);font-size:max(10px,calc(13px*var(--fs)))}
.over{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

.pipe{display:flex;gap:6px;align-items:flex-end;height:46px}

.pipe div:first-child i{background:var(--good)}
.pipe span{position:absolute;left:0;right:0;top:3px;text-align:center;font:500 9.5px var(--f-mono);color:var(--dim)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<style>

  .sidebar{padding:8px 8px}.sidebar .ni{padding:7px 0}.sidebar .ni svg{width:18px;height:18px}.logo{padding:0 0 4px}.logo svg{width:32px;height:32px;padding:7px}
}

/* ---- v13: segmen GPU, transisi halaman, animasi komponen, OS dan laptop ---- */
:root{--c-gpu_m:#c58a8a;--c-gpu_h:#b9788f;--c-gpu_w:#9f8fb8}
main.quiet *,main.quiet *::before,main.quiet *::after{animation:none!important;transition:none!important}
main.leave>*{animation:leave .18s cubic-bezier(.4,0,1,1) both}
@keyframes leave{to{opacity:0;transform:translateY(-8px) scale(.99)}}

.cc{transition:border-color .25s,background .25s,transform .25s,box-shadow .25s}

.stp b{display:inline-block;transition:transform .25s}

@keyframes roll{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.dr{transition:background .15s,transform .15s}.dr:active{transform:scale(.98)}

.toast3 .good{color:var(--good)}.toast3 .bad{color:var(--bad)}
@keyframes floatup{0%{opacity:0;transform:translateY(10px)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.kindsw{display:flex;gap:8px;margin-bottom:6px}

.os-grid{display:grid;gap:12px}

@media (prefers-reduced-motion:reduce){main.leave>*,.pl,.toast3 span,.cc.pulse,.stp b.roll{animation:none!important}}

function sfx(){try{const A=new(window.AudioContext||window.webkitAudioContext)();if(A.state!=='running'){A.close();return}const o=A.currentTime,m=A.createGain();m.gain.value=.5;m.connect(A.destination);
